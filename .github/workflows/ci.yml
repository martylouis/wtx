name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          # Only *.sh: shell/_wt.zsh is zsh, which shellcheck does not support.
          shopt -s nullglob
          shellcheck bin/wtx shell/*.sh

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install bats (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Install bats (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core
      - name: Run tests
        run: bats test/
      # macOS ships bash 3.2 as /bin/bash; wtx must keep working with it.
      - name: Run tests with /bin/bash (bash 3.2)
        if: runner.os == 'macOS'
        run: WTX_TEST_BASH=/bin/bash bats test/
